<html>
	<head>
		<title>El rinc&oacute;n de Hiptoff</title>
		<meta content="text/html; charset=UTF-8" http-equiv="content-type">
		<link rel="icon" type="image/x-icon" href="style/icon.png"/>	
		
		<link rel="stylesheet" href="style_shared.css"/>
		<link rel="stylesheet" href="style.css"/>
			
		<link rel="preload" as="image" href="style/bluesky_on.png"/>
		<link rel="preload" as="image" href="style/tiktok_on.png"/>
		<link rel="preload" as="image" href="style/tumblr_on.png"/>
		<link rel="preload" as="image" href="style/facebook_on.png"/>
		
		<script type="text/javascript" src="script.js"></script>
		<script type="text/javascript">
			document.addEventListener("DOMContentLoaded", () =>
			{
				const tooltip = document.getElementById("tooltip");
				
				// Books
				const oeo = document.getElementById("book_1");
				RegisterTooltip(oeo, "Yo te veo", 20, -20);
				RegisterLink(oeo, "./oeo/index.html");
				
				// Social media
				const bluesky = document.getElementById("social_media_1");
				RegisterTooltip(bluesky, "Bluesky", -10, -20);
				RegisterLink(bluesky, "https://bsky.app/profile/hiptoff.bsky.social");
				
				const tiktok = document.getElementById("social_media_2");
				RegisterTooltip(tiktok, "TikTok", -10, -20);
				RegisterLink(tiktok, "https://www.tiktok.com/@hiptoff");
				
				const tumblr = document.getElementById("social_media_3");
				RegisterTooltip(tumblr, "Tumblr", -10, -20);
				RegisterLink(tumblr, "https://hiptoff.tumblr.com/");
				
				const facebook = document.getElementById("social_media_4");
				RegisterTooltip(facebook, "Facebook", -10, -20);
				RegisterLink(facebook, "https://www.facebook.com/profile.php?id=61595742530831");
				
				// Copyright
				const copyright = document.getElementById("copyright");
				RegisterTooltip(copyright, "&copy; 2026, Hiptoff (todos los derechos reservados).<br/><br/>Haz clic para ver m&aacute;s detalles.", 0, -40);
			});
		</script>
	</head>
	<body>
		<div id="trees"></div>
		
		<div id="title"></div>
		
		<div id="social_media_list">
			<button id="social_media_1" class="social_media"/>
			<button id="social_media_2" class="social_media"/>
			<button id="social_media_3" class="social_media"/>
			<button id="social_media_4" class="social_media"/>
		</div>	
		
		<div id="books">
			<div id="stump">
				<button id="book_1" class="book"/>
				
				<button id="copyright" class="book" onclick="OnCopyrightClick()"/>
			 </div>
		</div>
		
		<div id="tooltip" class="tooltip"></div>
	</body>
</html>
